[project]
name = "finance-brazil-pipeline"
version = "0.1.0"
description = "Pipeline editorial Finance Brazil — busca, gera e publica notícias com revisão humana."
readme = "README.md"
requires-python = ">=3.12,<4.0"
dependencies = [
    "anthropic>=0.45.0",
    "httpx>=0.27.0",
    "supabase>=2.10.0",
    "python-dotenv>=1.0.0",
    "loguru>=0.7.0",
    "pydantic>=2.10.0",
    "feedparser>=6.0.10",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pipeline"]
